# =============================================================================
# Deploy-only reusable workflow.
#
# Deploys an ALREADY-PUBLISHED Helm chart from a classic Helm chart repository
# (e.g. ChartMuseum) to a Kubernetes cluster. It does not build, package, or
# publish anything — for the full build->publish->deploy pipeline use one of the
# *-cicd reusable workflows instead.
#
# The input contract mirrors the sibling templates (generic-chart-helm.yml et al)
# so callers look consistent: `environment`, multi-line `ingress-hosts` /
# `ingress-paths` / `ingress-tls-secrets`, `service-target-port`,
# `helm-set-values`, and the `helm-set-secret-values` secret. It emits the same
# chart value keys those templates use (the s9generic chart schema):
#   environment=<env>
#   ingress.hosts[i].host / ingress.hosts[i].tlsSecret   (zipped by index)
#   ingress.paths[i]
#   service.targetPort=<port>
#
# ROUTING MODES (routing-mode input):
#   ingress  DEFAULT. Legacy nginx Ingress via the ingress-* inputs. Behaviour
#            is unchanged from before Gateway API support existed: the gateway
#            steps are skipped and nothing extra reaches Helm.
#   gateway  Gateway API only. Routing values are rendered by the shared
#            `gateway-routing` action -- the SAME action the full gateway
#            pipeline (generic-gateway-helm-template.yml) uses -- and merged in
#            as a second --values file, so the slug/sectionName/parentRef logic
#            has one implementation in the estate, not two.
#   dual     Both. Emits the s9generic ingress schema
#            (ingress.hosts[].host / ingress.paths[]); charts with a different
#            ingress shape must stay on `ingress` or `gateway`.
#
#   SHARED vs DEDICATED listener: pass `gateway-section-name` (or
#   `gateway-section-names`) naming an EXISTING listener and onboarding becomes
#   a read-only assertion. Omit it and onboarding runs DEDICATED mode, which
#   creates a per-host listener + Certificate and mutates the shared Gateway on
#   every deploy -- the documented cause of listener drift on the shared edges.
#
#   Value precedence, lowest to highest:
#     caller values file  ->  rendered gateway values  ->  --set  ->  --set-string
#
# Deploy guardrails:
#   - concurrency: serializes runs per namespace+release so two deploys can't
#     race the same Helm release (cancel-in-progress: false — never cancel a
#     half-applied upgrade).
#   - timeout-minutes: bounds a hung run (helm-timeout only bounds the Helm call).
#   - gh-environment: optional GitHub Environment for approvals / deployment
#     history. NOTE: distinct from the `environment` input, which is a Helm value.
#
# The Helm logic is delegated to the shared composite action
# `simplify9/.github/.github/actions/helm-deploy` (the same action used by the
# full CI/CD pipelines), keeping deploy behaviour — Helm 3/4 atomic flag
# selection, kubeconfig handling, verification and the job summary — consistent.
# =============================================================================

name: Helm Deploy (values file) - reusable
on:
  workflow_call:
    inputs:
      release-name:
        description: Helm release name to upgrade/install.
        type: string
        required: true

      chart-name:
        description: Name of the chart to pull from the chart repository.
        type: string
        required: true

      chart-repo:
        description: Classic Helm chart repository URL (ChartMuseum-style) to 
          pull the chart from.
        type: string
        required: true

      namespace:
        description: Kubernetes namespace to deploy the release into.
        type: string
        required: true

      values-file:
        description: >-
          Path to a values file in the caller's repo, applied with `--values` only
          when present. A missing default (values.yaml) is skipped; an explicitly-set
          file that is missing fails fast.
        type: string
        required: false
        default: values.yaml

      chart-version:
        description: >-
          Chart version to deploy. Leave empty to deploy the latest version published
          in the repo; set it to pin a specific chart version.
        type: string
        required: false
        default: ""

      environment:
        description: >-
          Helm VALUE for the chart (set as `environment=<env>`). This is NOT the GitHub
          Environment — see `gh-environment` for that.
        type: string
        required: false
        default: ""

      gh-environment:
        description: >-
          Optional GitHub Environment name for deployment protection rules,
          environment-scoped secrets and deployment history. Empty = no environment
          binding.
        type: string
        required: false
        default: ""

      service-target-port:
        description: Optional service target port to set on the chart (empty = 
          chart default).
        type: string
        required: false
        default: ""

      ingress-hosts:
        description: >-
          Ingress hosts, one per line or comma-separated. Zipped with ingress-tls-secrets
          by index: host[i] <-> tls-secret[i].
        type: string
        required: false
        default: ""

      ingress-paths:
        description: Ingress paths, one per line or comma-separated (empty = 
          chart default).
        type: string
        required: false
        default: ""

      ingress-tls-secrets:
        description: TLS secret names, position-aligned with ingress-hosts.
        type: string
        required: false
        default: ""

      # ---------------------------------------------------------------------
      # Gateway API routing (opt-in).
      #
      # routing-mode defaults to `ingress`, which is the pre-existing behaviour
      # bit-for-bit: the render/onboard steps below are skipped entirely and
      # nothing new is passed to Helm. Existing callers are unaffected.
      # ---------------------------------------------------------------------
      routing-mode:
        description: >-
          Routing mode: `ingress` (default, legacy nginx Ingress via the
          ingress-* inputs), `gateway` (Gateway API HTTPRoute only), or `dual`
          (both). Anything other than `ingress` renders a gateway values file
          with the shared gateway-routing action and merges it into the deploy.
          NOTE: `dual` emits the s9generic ingress schema
          (ingress.hosts[].host / ingress.paths[]); charts using a different
          ingress shape should stay on `ingress` or `gateway`.
        type: string
        required: false
        default: ingress

      gateway-hostnames:
        description: Gateway hostnames, comma- or newline-separated.
        type: string
        required: false
        default: ""

      gateway-paths:
        description: >-
          Gateway route paths, comma- or newline-separated. Empty falls back to
          ingress-paths, then to `/`.
        type: string
        required: false
        default: ""

      gateway-path-type:
        description: Gateway route path type (PathPrefix or Exact).
        type: string
        required: false
        default: PathPrefix

      gateway-parent-name:
        description: Gateway parentRef name (the Gateway to attach the route to).
        type: string
        required: false
        default: public-gateway

      gateway-parent-namespace:
        description: Namespace the parent Gateway lives in.
        type: string
        required: false
        default: s9-dev-edge

      gateway-section-name:
        description: >-
          Gateway sectionName override — the name of an EXISTING listener on the
          parent Gateway (e.g. `https-wildcard-sf9-io`). Setting this selects
          SHARED LISTENER MODE: onboarding creates no listener and no
          Certificate, it only asserts the named listener exists and fails the
          deploy if it does not. Pass this for every app on a shared wildcard
          domain — omitting it runs DEDICATED mode, which mutates the shared
          Gateway on every deploy.
        type: string
        required: false
        default: ""

      gateway-section-names:
        description: >-
          Per-hostname sectionName overrides, one per line, position-aligned
          with gateway-hostnames. A blank line means DEDICATED mode for that
          host; a non-empty line means SHARED mode. Mutually exclusive with
          gateway-section-name (the shared action fails if both are set).
        type: string
        required: false
        default: ""

      gateway-backend-service-name:
        description: >-
          Backend Service name for the route. Empty means the chart's own
          Service (the chart fills in its fullname).
        type: string
        required: false
        default: ""

      gateway-backend-port:
        description: Backend Service port for the route.
        type: string
        required: false
        default: "80"

      gateway-auto-onboarding:
        description: >-
          Run the gateway-onboard action before deploying. In shared-listener
          mode this is a cheap, loud pre-flight assertion that the listener
          exists. Set false only when the caller does not own the Gateway and
          cannot read it.
        type: boolean
        required: false
        default: true

      gateway-class-name:
        description: GatewayClass used if onboarding has to create the Gateway (DEDICATED mode only).
        type: string
        required: false
        default: cilium

      gateway-cert-issuer-name:
        description: cert-manager issuer name (DEDICATED mode only).
        type: string
        required: false
        default: letsencrypt-production-gateway

      gateway-cert-issuer-kind:
        description: cert-manager issuer kind (DEDICATED mode only).
        type: string
        required: false
        default: ClusterIssuer

      gateway-cert-wait:
        description: Wait for certificate readiness during onboarding (DEDICATED mode only).
        type: boolean
        required: false
        default: true

      gateway-cert-wait-timeout-seconds:
        description: Certificate readiness timeout in seconds (DEDICATED mode only).
        type: string
        required: false
        default: "600"

      gateway-verify-route:
        description: >-
          After a gateway deploy, assert the HTTPRoute actually exists and was
          Accepted by the parent Gateway. This is the guard against the estate's
          most expensive silent failure: a chart that renders no HTTPRoute (or
          one pointing at a listener that does not match) still reports a
          successful `helm upgrade`, and the app is simply unreachable.
        type: boolean
        required: false
        default: true

      image-tag:
        description: Optional image tag to set on the chart (empty = chart 
          default).
        type: string
        required: false
        default: ""

      helm-set-values:
        description: Non-secret helm --set values, one key=value per line.
        type: string
        required: false
        default: ""

      helm-version:
        description: Helm CLI version to install for the deploy.
        type: string
        required: false
        default: v4.2.0

      kubectl-version:
        description: kubectl CLI version to install for the deploy.
        type: string
        required: false
        default: v1.33.0

      helm-timeout:
        description: Timeout passed to the Helm upgrade/install call.
        type: string
        required: false
        default: 10m

      atomic:
        description: Use Helm's atomic flag so a failed upgrade rolls back 
          automatically.
        type: boolean
        required: false
        default: true

      wait:
        description: Wait for resources to become ready before reporting 
          success.
        type: boolean
        required: false
        default: true

      create-namespace:
        description: Create the target namespace if it does not already exist.
        type: boolean
        required: false
        default: true

      job-timeout-minutes:
        description: >-
          Upper bound for the whole job (checkout + setup + helm). The Helm call itself
          is bounded separately by helm-timeout.
        type: number
        required: false
        default: 20

    secrets:
      # Cluster access. Accepts either a base64-encoded kubeconfig or raw YAML
      # (auto-detected). `kubeconfig` matches the sibling templates;
      # `kubeconfig64` is kept for backward compatibility. Provide one.
      kubeconfig:
        required: false
      kubeconfig64:
        required: false

      # Comma-separated key=value pairs applied as masked helm --set-string
      # values (e.g. "db=<connection>,apiKey=<token>"). Same contract as the
      # *-cicd reusable workflows. Note: values are comma-separated, so a value
      # containing a literal comma cannot be passed through this channel.
      helm-set-secret-values:
        required: false

      github-token:
        description: "Unused by this workflow -- kept only so a caller already
          passing it doesn't break with an undeclared-secret error. The critical-vuln
          gate uses dependabot-alerts-token instead (GITHUB_TOKEN cannot access the
          Dependabot Alerts API regardless of permissions granted)."
        required: false
      dependabot-alerts-token:
        description: "PAT/App token (NOT GITHUB_TOKEN) with 'Dependabot alerts: read'
          for the critical-vuln gate -- GITHUB_TOKEN cannot access this API
          regardless of granted permissions (confirmed by live testing)."
        required: false

  workflow_dispatch:
permissions:
  contents: write

  security-events: read
jobs:
  critical-vuln-gate:
    name: Dependabot Check
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: read
      contents: write
    steps:
      - name: Check for open critical Dependabot alerts
        uses: simplify9/.github/.github/actions/check-critical-vulns@main
        with:
          dependabot-alerts-token: ${{ secrets.dependabot-alerts-token }}
          repository: ${{ github.repository }}

      - name: Write job summary
        if: always()
        uses: simplify9/.github/.github/actions/write-job-summary@main
        with:
          title: Critical Dependabot Vulnerability Gate
          status: ${{ job.status }}

  deploy:
    needs: critical-vuln-gate
    if: ${{ !cancelled() && (needs.critical-vuln-gate.result == 'success' || 
      needs.critical-vuln-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    # Optional GitHub Environment. Empty string => no environment binding, so
    # existing callers that don't pass gh-environment are unaffected.
    environment: ${{ inputs.gh-environment }}
    # Serialize deploys to the same release/namespace. Never cancel an in-flight
    # deploy — a half-applied Helm upgrade is worse than a queued one.
    concurrency:
      group: helm-deploy-${{ inputs.namespace }}-${{ inputs.release-name }}
      cancel-in-progress: false

    steps:
      - name: Validate kubeconfig secret
        env:
          KUBECONFIG_PRIMARY: ${{ secrets.kubeconfig }}
          KUBECONFIG_LEGACY: ${{ secrets.kubeconfig64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_PRIMARY}${KUBECONFIG_LEGACY}" ]; then
            echo "::error title=Missing kubeconfig::Provide either the 'kubeconfig' or 'kubeconfig64' secret."
            exit 1
          fi
          echo "Kubeconfig secret provided."

      # Only the values file is needed from the caller repo (the chart is pulled
      # remotely), so a sparse, shallow checkout keeps this fast on large repos.
      # An empty values-file makes sparse-checkout a no-op (full checkout).
      - name: Checkout (values file only)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: ${{ inputs.values-file }}
          sparse-checkout-cone-mode: false
          # Only the values file is read; no git writes happen, so don't leave the
          # workflow token persisted in .git/config for later steps.
          persist-credentials: false

      # Translate the friendly inputs into the s9generic chart value keys, as a
      # comma-separated --set string for the helm-deploy action. Mirrors the
      # ingress mapping used by generic-chart-helm.yml. Secret values go straight
      # through to secret-set-string-values via the helm-set-secret-values secret.
      - name: Build Helm --set values
        id: prep
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE_TARGET_PORT: ${{ inputs.service-target-port }}
          INGRESS_HOSTS: ${{ inputs.ingress-hosts }}
          INGRESS_PATHS: ${{ inputs.ingress-paths }}
          INGRESS_TLS_SECRETS: ${{ inputs.ingress-tls-secrets }}
          HELM_SET_VALUES: ${{ inputs.helm-set-values }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          set -euo pipefail

          CSV=""
          add() { [ -z "$1" ] && return 0; if [ -z "$CSV" ]; then CSV="$1"; else CSV="${CSV},$1"; fi; }
          # Trim leading/trailing whitespace using bash parameter expansion only
          # (no subprocess per item); result returned in $REPLY.
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; s="${s%"${s##*[![:space:]]}"}"; REPLY="$s"; }
          # Split newline/comma-separated text into the named array. Reading into
          # an array up front avoids running anything that consumes stdin inside a
          # read loop (which would swallow the remaining lines).
          split() { mapfile -t "$1" < <(printf '%s' "$2" | sed 's/\r//g' | tr ',' '\n'); }

          [ -n "$ENVIRONMENT" ] && add "environment=${ENVIRONMENT}"
          [ -n "$SERVICE_TARGET_PORT" ] && add "service.targetPort=${SERVICE_TARGET_PORT}"

          # Ingress hosts, zipped with TLS secrets by index (host[i] <-> tls[i]).
          split HOSTS "$INGRESS_HOSTS"
          split TLS_LIST "$INGRESS_TLS_SECRETS"
          idx=0
          for raw in "${HOSTS[@]}"; do
            trim "$raw"; host="$REPLY"
            [ -z "$host" ] && continue
            add "ingress.hosts[$idx].host=${host}"
            if [ "$idx" -lt "${#TLS_LIST[@]}" ]; then
              trim "${TLS_LIST[$idx]}"; tls="$REPLY"
              [ -n "$tls" ] && add "ingress.hosts[$idx].tlsSecret=${tls}"
            fi
            idx=$((idx + 1))
          done

          # Ingress paths.
          split PATHS "$INGRESS_PATHS"
          pidx=0
          for raw in "${PATHS[@]}"; do
            trim "$raw"; path="$REPLY"
            [ -z "$path" ] && continue
            add "ingress.paths[$pidx]=${path}"
            pidx=$((pidx + 1))
          done

          # Caller's extra non-secret --set values, one key=value per line.
          split EXTRA "$HELM_SET_VALUES"
          for raw in "${EXTRA[@]}"; do
            trim "$raw"; kv="$REPLY"
            [ -z "$kv" ] && continue
            add "$kv"
          done

          echo "set-values=${CSV}" >> "$GITHUB_OUTPUT"
          echo "Computed --set values: ${CSV:-<none>}"

          # Resolve the values file: apply it only if present. A missing DEFAULT
          # (values.yaml) is skipped; an explicitly-specified missing file fails.
          RESOLVED=""
          if [ -n "$VALUES_FILE" ]; then
            if [ -f "$VALUES_FILE" ]; then
              RESOLVED="$VALUES_FILE"
              echo "Using values file: $VALUES_FILE"
            elif [ "$VALUES_FILE" = "values.yaml" ]; then
              echo "::notice title=No values file::Default 'values.yaml' not found in the repo; deploying without --values."
            else
              echo "::error title=values-file not found::'$VALUES_FILE' was specified but is not present in the checked-out repository."
              exit 1
            fi
          fi
          echo "values-file=${RESOLVED}" >> "$GITHUB_OUTPUT"

      # Gateway API routing values are produced by the same shared, parameterised
      # action the full gateway pipeline uses (generic-gateway-helm-template.yml),
      # rather than being re-derived here. That keeps one implementation of the
      # slug/sectionName/parentRef logic in the estate instead of a second copy
      # that can drift. It writes a real YAML file under $RUNNER_TEMP — never
      # into the workspace, which would collide with the sparse-checkout above.
      - name: Render gateway routing values
        id: routing
        if: ${{ inputs.routing-mode != 'ingress' }}
        uses: simplify9/.github/.github/actions/gateway-routing@main
        with:
          routing-mode: ${{ inputs.routing-mode }}
          gateway-parent-name: ${{ inputs.gateway-parent-name }}
          gateway-parent-namespace: ${{ inputs.gateway-parent-namespace }}
          gateway-section-name: ${{ inputs.gateway-section-name }}
          gateway-section-names: ${{ inputs.gateway-section-names }}
          gateway-hostnames: ${{ inputs.gateway-hostnames }}
          gateway-paths: ${{ inputs.gateway-paths }}
          gateway-path-type: ${{ inputs.gateway-path-type }}
          gateway-backend-service-name: ${{ inputs.gateway-backend-service-name }}
          gateway-backend-port: ${{ inputs.gateway-backend-port }}
          ingress-hosts: ${{ inputs.ingress-hosts }}
          ingress-paths: ${{ inputs.ingress-paths }}
          ingress-tls-secrets: ${{ inputs.ingress-tls-secrets }}

      # helm-deploy takes ONE values-file path, already spoken for by the
      # caller's repo values file. The rendered gateway YAML is therefore passed
      # through its inline `values` input instead: the action emits
      # `--values <caller file>` then `--values <inline tmp>`, so the gateway
      # values land after — and thus win over — the caller's file, while --set
      # and --set-string still win over both. No change to the shared action.
      - name: Load rendered gateway values
        id: gwvalues
        if: ${{ inputs.routing-mode != 'ingress' }}
        env:
          ROUTING_FILE: ${{ steps.routing.outputs.values-file }}
        run: |
          set -euo pipefail
          if [ ! -f "$ROUTING_FILE" ]; then
            echo "::error title=Gateway values missing::gateway-routing reported '$ROUTING_FILE' but it does not exist."
            exit 1
          fi
          echo "----- rendered gateway values -----"
          cat "$ROUTING_FILE"
          # Random heredoc delimiter (repo convention) so rendered content can
          # never terminate the block early.
          DELIM="EOF_$(dd if=/dev/urandom bs=15 count=1 status=none | base64 | tr -dc 'a-zA-Z0-9')"
          {
            echo "yaml<<${DELIM}"
            cat "$ROUTING_FILE"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # Shared-listener mode makes this a read-only assertion that the named
      # listener exists — it creates nothing. Dedicated mode (no section name)
      # provisions a listener + Certificate and MUTATES the shared Gateway, which
      # is why gateway-section-name should be set for any app on a wildcard domain.
      - name: Onboard gateway hostnames
        if: ${{ inputs.routing-mode != 'ingress' && inputs.gateway-auto-onboarding }}
        uses: simplify9/.github/.github/actions/gateway-onboard@main
        with:
          kubeconfig: ${{ secrets.kubeconfig || secrets.kubeconfig64 }}
          namespace: ${{ inputs.namespace }}
          gateway-parent-name: ${{ inputs.gateway-parent-name }}
          gateway-parent-namespace: ${{ inputs.gateway-parent-namespace }}
          gateway-class-name: ${{ inputs.gateway-class-name }}
          gateway-cert-issuer-name: ${{ inputs.gateway-cert-issuer-name }}
          gateway-cert-issuer-kind: ${{ inputs.gateway-cert-issuer-kind }}
          gateway-cert-wait: ${{ inputs.gateway-cert-wait }}
          gateway-cert-wait-timeout-seconds: ${{ inputs.gateway-cert-wait-timeout-seconds }}
          gateway-section-name: ${{ inputs.gateway-section-name }}
          gateway-host-list: ${{ steps.routing.outputs.gateway-host-list }}
          gateway-section-names-list: ${{ steps.routing.outputs.gateway-section-names-list }}

      - name: Deploy with Helm
        uses: simplify9/.github/.github/actions/helm-deploy@main
        with:
          chart-source-type: chartmuseum
          chart-repo-url: ${{ inputs.chart-repo }}
          chart-name: ${{ inputs.chart-name }}
          chart-version: ${{ inputs.chart-version }}
          release-name: ${{ inputs.release-name }}
          namespace: ${{ inputs.namespace }}
          values-file: ${{ steps.prep.outputs.values-file }}
          # Empty in ingress mode, so the Helm invocation is unchanged there.
          values: ${{ steps.gwvalues.outputs.yaml }}
          set-values: ${{ steps.prep.outputs.set-values }}
          secret-set-string-values: ${{ secrets.helm-set-secret-values }}
          image-tag: ${{ inputs.image-tag }}
          create-namespace: ${{ inputs.create-namespace }}
          atomic: ${{ inputs.atomic }}
          wait: ${{ inputs.wait }}
          timeout: ${{ inputs.helm-timeout }}
          helm-version: ${{ inputs.helm-version }}
          kubectl-version: ${{ inputs.kubectl-version }}
          kubeconfig: ${{ secrets.kubeconfig || secrets.kubeconfig64 }}

      # A successful `helm upgrade` is NOT evidence that traffic will flow. Two
      # failure modes both report success and serve nothing:
      #   1. the chart renders no HTTPRoute at all (gateway.* values silently
      #      ignored by a chart version that predates Gateway API support);
      #   2. the route attaches to a listener that cannot serve its hostname.
      # Case 1 is caught by the existence check, case 2 by reading the parent's
      # Accepted condition. Both are otherwise invisible until users report 404s.
      - name: Verify HTTPRoute attached
        if: ${{ inputs.routing-mode != 'ingress' && inputs.gateway-verify-route }}
        env:
          KUBECONFIG_DATA: ${{ secrets.kubeconfig || secrets.kubeconfig64 }}
          RELEASE_NAME: ${{ inputs.release-name }}
          NAMESPACE: ${{ inputs.namespace }}
          ROUTING_MODE: ${{ inputs.routing-mode }}
        run: |
          set -euo pipefail
          KUBECONFIG_FILE="$RUNNER_TEMP/kubeconfig-verify"
          trap 'rm -f "$KUBECONFIG_FILE"' EXIT
          # Secret is accepted base64-encoded or as raw YAML, matching the
          # kubeconfig handling in the shared deploy actions.
          if printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$KUBECONFIG_FILE" 2>/dev/null &&
             head -c 512 "$KUBECONFIG_FILE" | grep -q 'apiVersion'; then :; else
            printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG_FILE"
          fi
          chmod 600 "$KUBECONFIG_FILE"
          export KUBECONFIG="$KUBECONFIG_FILE"

          echo "::group::[GATEWAY] HTTPRoutes for release $RELEASE_NAME"
          ROUTES="$(kubectl -n "$NAMESPACE" get httproute \
            -l "app.kubernetes.io/instance=$RELEASE_NAME" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
          # Fall back to the release name for charts that do not label the route.
          if [ -z "$ROUTES" ] && kubectl -n "$NAMESPACE" get httproute "$RELEASE_NAME" >/dev/null 2>&1; then
            ROUTES="$RELEASE_NAME"
          fi
          if [ -z "$ROUTES" ]; then
            echo "::error title=No HTTPRoute::routing-mode is '$ROUTING_MODE' but the release created no HTTPRoute in namespace '$NAMESPACE'. The deployed chart most likely has no HTTPRoute template - gateway.* values are silently ignored by chart versions that predate Gateway API support. Check the chart version that was actually deployed."
            exit 1
          fi

          RC=0
          for r in $ROUTES; do
            echo "-- $r"
            kubectl -n "$NAMESPACE" get httproute "$r" -o jsonpath='{range .status.parents[*]}  parent={.parentRef.name}/{.parentRef.sectionName}{range .conditions[*]} {.type}={.status}({.reason}){end}{"\n"}{end}'
            # Accepted=False is the loud, greppable failure - e.g. NoMatchingParent
            # when sectionName names a listener that does not exist.
            if kubectl -n "$NAMESPACE" get httproute "$r" -o json |
               tr -d ' \n' | grep -q '"type":"Accepted","status":"False"'; then
              echo "::error title=HTTPRoute not accepted::'$r' was rejected by its parent Gateway (conditions above)."
              RC=1
            fi
          done
          echo "::endgroup::"
          if [ "$RC" -eq 0 ]; then echo "HTTPRoute(s) accepted by the parent Gateway."; fi
          exit "$RC"
