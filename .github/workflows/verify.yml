# =============================================================================
# Verify -- reusable workflow (one required check per repo)
# =============================================================================
# Called by workflow-templates/verify.yml as the job id `verify`, so the check
# to mark REQUIRED in org rulesets is `verify / result`. That one check gates
# auto-merge of Renovate PRs into develop and every PR into the default branch.
#
# Scope (spec ruling): the full ladder runs when the event is workflow_dispatch,
# OR the PR base is the repo's default branch, OR the PR author is the bot
# (input `bot-login`). A human PR into develop/development/staging skips every
# job except `result`, which then passes immediately (about 1 billed minute).
# The scope expression appears in the `plan` and `result` jobs below; the verify-plan
# action's test_scope.sh asserts both copies are identical and documents the truth table.
#
# Jobs:
#   plan      scope gate: effective known-failing list, deps_changed, contract_mode
#   contract  per-stack verification contract (verify-contract action)
#   node      web ladder: install, consistency, lint, typecheck, test, build, worker dry run, e2e/smoke
#             (strapi: install and consistency only)
#   dotnet, docker-smoke, react-native, android, maestro, flutter, strapi
#             ladder stubs (`if: false`), replaced by later tasks; ids are fixed
#             so `result.needs` never changes
#   result    always runs; fails on any failed/cancelled needed job, or when the
#             scope is full and `plan` did not succeed. Skipped jobs are fine.
#             Uploads verify-report.json as artifact `verify-report`.
#
# `stack: infra` runs no ladder jobs: result passes when plan + contract succeed.
# =============================================================================
name: Verify

on:
  workflow_call:
    inputs:
      stack:
        description: "Stack to verify: dotnet-service, dotnet-library, web, react-native, flutter, strapi, or infra (infra runs no ladder jobs)."
        required: true
        type: string
      working-directory:
        description: Directory containing the project (repo root by default).
        required: false
        type: string
        default: "."
      known-failing:
        description: "Space-separated step ids tolerated until contract-deadline (install consistency lint typecheck test build worker-dry-run e2e bundle android maestro analyze docker smoke rehearsal)."
        required: false
        type: string
        default: ""
      contract-deadline:
        description: Contract deadline (YYYY-MM-DD). Empty means warn mode and known-failing never expires.
        required: false
        type: string
        default: ""
      bot-login:
        description: Login of the dependency bot whose PRs always get the full ladder.
        required: false
        type: string
        default: "s9-deps-bot[bot]"
      node-version:
        description: Node.js version for web, react-native and strapi stacks.
        required: false
        type: string
        default: "24"
      dotnet-version:
        description: .NET SDK version for dotnet stacks.
        required: false
        type: string
        default: "10.0.x"
      java-version:
        description: Java version for Android builds.
        required: false
        type: string
        default: "17"
      flutter-version:
        description: Flutter version for the flutter stack.
        required: false
        type: string
        default: "3.x"
      smoke-path:
        description: HTTP path probed by the docker smoke test (empty skips the HTTP probe).
        required: false
        type: string
        default: ""
      postgres-version:
        description: PostgreSQL version for jobs that need a database.
        required: false
        type: string
        default: "16"
    secrets:
      dependabot-alerts-token:
        description: Token able to read Dependabot alerts (critical-vulnerability gate).
        required: false
      nuget-restore-token:
        description: Token for restoring private NuGet packages.
        required: false
      npm-token:
        description: Token for restoring private npm packages.
        required: false

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  plan:
    name: plan
    # Full-scope expression. Must equal the one in `result` (guarded by
    # .github/actions/verify-plan/test_scope.sh; truth table: verify_full in scope.sh).
    if: github.event_name == 'workflow_dispatch' || github.base_ref == github.event.repository.default_branch || github.event.pull_request.user.login == inputs.bot-login
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      known_failing: ${{ steps.plan.outputs.known_failing }}
      deps_changed: ${{ steps.plan.outputs.deps_changed }}
      contract_mode: ${{ steps.plan.outputs.contract_mode }}
    steps:
      - name: Plan
        id: plan
        uses: simplify9/.github/.github/actions/verify-plan@main
        with:
          github-token: ${{ github.token }}
          event-name: ${{ github.event_name }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          known-failing: ${{ inputs.known-failing }}
          deadline: ${{ inputs.contract-deadline }}

      - name: Write summary
        if: always()
        uses: simplify9/.github/.github/actions/write-job-summary@main
        with:
          title: Verify plan
          status: ${{ job.status }}
          details: |
            | Field | Value |
            |-------|-------|
            | Stack | `${{ inputs.stack }}` |
            | Deps changed | `${{ steps.plan.outputs.deps_changed }}` |
            | Contract mode | `${{ steps.plan.outputs.contract_mode }}` |

  contract:
    name: contract
    needs: plan
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      missing: ${{ steps.contract.outputs.missing }}
      mode: ${{ steps.contract.outputs.mode }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verification contract
        id: contract
        uses: simplify9/.github/.github/actions/verify-contract@main
        with:
          stack: ${{ inputs.stack }}
          working-directory: ${{ inputs.working-directory }}
          deadline: ${{ inputs.contract-deadline }}

      - name: Write summary
        if: always()
        uses: simplify9/.github/.github/actions/write-job-summary@main
        with:
          title: Verification contract
          status: ${{ job.status }}
          details: |
            | Field | Value |
            |-------|-------|
            | Mode | `${{ steps.contract.outputs.mode }}` |
            | Missing | `${{ steps.contract.outputs.missing }}` |

  # --- Ladder stubs (C4-C9 replace these; keep the ids) ---
  # `inputs.stack == ''` is never true (stack is required): a disabled stub that
  # keeps actionlint quiet (it rejects a literal `if: false`).
  node:
    name: node
    needs: plan
    if: inputs.stack == 'web' || inputs.stack == 'strapi'
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.collect.outputs.failed }}
      warned: ${{ steps.collect.outputs.warned }}
    # Untrusted PR code runs here: read-only token, no deploy secrets. The token
    # is exported job-wide because yarn 1 expands ${GITHUB_TOKEN} from .npmrc on
    # every invocation (see vite-cloudflare-worker.yml).
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Detect package manager, set up Node and install from the lockfile.
      - name: Install
        id: install
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' install ') }}
        uses: simplify9/.github/.github/actions/verify-web-install@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      - name: Consistency
        id: consistency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' consistency ') }}
        uses: simplify9/.github/.github/actions/verify-node-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ steps.install.outputs.package-manager }}

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' lint ') }}
        env:
          RUNNER: ${{ steps.install.outputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' lint; then
            "${RUNNER}" run lint
          else
            echo "::notice title=[VERIFY] lint::no lint script in package.json, skipped"
          fi

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' typecheck ') }}
        env:
          RUNNER: ${{ steps.install.outputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' typecheck; then
            "${RUNNER}" run typecheck
          else
            echo "::notice title=[VERIFY] typecheck::no typecheck script in package.json, skipped"
          fi

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' test ') }}
        env:
          RUNNER: ${{ steps.install.outputs.runner }}
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' test; then
            "${RUNNER}" run test
          else
            echo "::notice title=[VERIFY] test::no test script in package.json, skipped"
          fi

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' build ') }}
        env:
          RUNNER: ${{ steps.install.outputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' build; then
            "${RUNNER}" run build
          else
            echo "::notice title=[VERIFY] build::no build script in package.json, skipped"
          fi
      - name: Workers dry run
        id: worker-dry-run
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped') }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' worker-dry-run ') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f wrangler.toml ] || [ -f wrangler.json ] || [ -f wrangler.jsonc ]; then
            npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler"
          else
            echo "::notice title=[VERIFY] worker-dry-run::no wrangler config, skipped"
          fi

      - name: Probe e2e script
        id: e2e-probe
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' }}
        shell: bash
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.["test:e2e"] ? 0 : 1)'; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: E2E (repo Playwright script)
        id: e2e
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' && steps.e2e-probe.outputs.has == 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped') }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' e2e ') }}
        shell: bash
        env:
          RUNNER: ${{ steps.install.outputs.runner }}
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          "${RUNNER}" run test:e2e

      # No e2e script: fallback smoke test until the contract deadline (after it
      # the contract job already fails). Reported under the canonical id `e2e`.
      - name: Smoke test (no e2e script)
        id: smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.stack == 'web' && steps.e2e-probe.outputs.has == 'false' && needs.plan.outputs.contract_mode != 'enforce' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped') }}
        continue-on-error: ${{ contains(format(' {0} ', needs.plan.outputs.known_failing), ' e2e ') }}
        uses: simplify9/.github/.github/actions/verify-web-smoke@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Collect outcomes
        id: collect
        if: always()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS"])
          ids = ["install", "consistency", "lint", "typecheck", "test", "build", "worker-dry-run", "e2e", "smoke"]
          failed, warned = [], []
          for i in ids:
              s = steps.get(i)
              if not s or s.get("outcome") != "failure":
                  continue
              name = "e2e" if i == "smoke" else i
              # conclusion is "success" when continue-on-error swallowed the failure
              (warned if s.get("conclusion") == "success" else failed).append(name)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("failed=" + " ".join(failed) + "\n")
              f.write("warned=" + " ".join(warned) + "\n")
          PY

      - name: Write summary
        if: always()
        uses: simplify9/.github/.github/actions/write-job-summary@main
        with:
          title: Verify node
          status: ${{ job.status }}
          details: |
            | Field | Value |
            |-------|-------|
            | Package manager | `${{ steps.install.outputs.package-manager }}` |
            | Failed | `${{ steps.collect.outputs.failed }}` |
            | Warned (known failing) | `${{ steps.collect.outputs.warned }}` |
  dotnet:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"
  docker-smoke:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"
  react-native:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"
  android:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_RUNNER_ANDROID || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"
  maestro:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"
  flutter:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"
  strapi:
    needs: plan
    if: inputs.stack == ''
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    steps:
      - run: echo "stub"

  result:
    name: result
    # `if: always()` is essential: a job whose needs were skipped is skipped, and
    # a skipped required check never reports. Verdict is computed from needs results.
    needs: [plan, contract, node, dotnet, docker-smoke, react-native, android, maestro, flutter, strapi]
    if: always()
    runs-on: ${{ vars.S9_RUNNER || vars.S9_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Evaluate
        id: verdict
        shell: bash
        env:
          # Same expression as the `plan` job `if:`.
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == github.event.repository.default_branch || github.event.pull_request.user.login == inputs.bot-login }}
          BASE: ${{ github.base_ref }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os

          needs = json.loads(os.environ["NEEDS"])
          full = os.environ["FULL"] == "true"
          base = os.environ["BASE"]

          def out(job, key):
              return (needs.get(job, {}).get("outputs") or {}).get(key, "") or ""

          bad = sorted(j for j, n in needs.items() if n.get("result") in ("failure", "cancelled"))
          plan_ok = needs.get("plan", {}).get("result") == "success"
          problems = [f"{j} {needs[j]['result']}" for j in bad]
          if full and not plan_ok and "plan" not in bad:
              problems.append(f"plan {needs.get('plan', {}).get('result')} (expected success)")

          ladder = [j for j in needs if j not in ("plan", "contract")]
          report = {
              "scope": "full" if full else "skipped-human-develop",
              "failed": sorted(w for j in ladder for w in out(j, "failed").split()),
              "warned": sorted(w for j in ladder for w in out(j, "warned").split()),
              "missing": out("contract", "missing").split(),
          }
          with open("verify-report.json", "w") as f:
              json.dump(report, f, indent=2)

          status = "failure" if problems else "success"
          if problems:
              line = "Verification failed: " + "; ".join(problems)
          elif not full:
              line = f"Human PR into {base}: verification not required by policy (spec ruling 5)."
          else:
              line = "Verification passed."
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\n")
              f.write(f"summary={line}\n")
          print(line)
          if problems:
              print("::error title=[VERIFY] Result::" + "; ".join(problems))
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 5
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        uses: simplify9/.github/.github/actions/write-job-summary@main
        with:
          title: Verify result
          status: ${{ steps.verdict.outputs.status }}
          details: ${{ steps.verdict.outputs.summary }}

      - name: Enforce verdict
        if: always() && steps.verdict.outputs.status != 'success'
        shell: bash
        run: exit 1
