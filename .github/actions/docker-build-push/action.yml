# =============================================================================
# Docker Build and Push
# =============================================================================
# Builds a Docker image (optionally multi-platform via Buildx/QEMU) and pushes
# it to a container registry. Each build publishes up to three independent,
# short tags: the version (x.y.z), the branch name (auto-detected from the
# running ref), and 'latest' (moving, on by default; opt out via tag-latest).
# Keeping them separate avoids one long combined tag. Registry auth uses
# docker/login-action so credentials are never placed on a command line.
#
# Behaviour:
#   - QEMU is only set up for non-native/multi-arch builds (skipped for the
#     single-arch linux/amd64 default to save setup time).
#   - push/cache inputs are strings (composite-action inputs always are) and are
#     compared with == 'true' so unexpected values degrade predictably.
#   - provenance/sbom are disabled for DOCR compatibility (see inline notes).
#
# Inputs:
#   registry       (optional)  Registry URL. Default 'docker.io'.
#   image-name     (required)  Image name (e.g. simplify9/sw-surl-api).
#   version        (required)  Version tag for the image.
#   username       (required)  Registry username.
#   password       (required)  Registry password or token.
#   dockerfile     (optional)  Path to Dockerfile. Default './Dockerfile'.
#   context        (optional)  Build context. Default '.'.
#   platforms      (optional)  Target platforms. Default 'linux/amd64'.
#   push           (optional)  Push image to registry. Default 'true'.
#   tag-latest     (optional)  Also tag/push 'latest' on every push. Default 'true'.
#   cache          (optional)  Enable GHA build cache. Default 'true'.
#   (The branch-named tag is auto-detected from github.ref_name — not an input.)
#   build-args     (optional)  Newline-separated build args (KEY=VALUE).
#   build-secrets  (optional)  Newline-separated BuildKit secrets (KEY=VALUE).
#
# Outputs (set on the success path):
#   image-tags     The generated image tags.
#   image-digest   The pushed image digest.
#
# Usage:
#   - name: Build and push Docker image
#     uses: simplify9/.github/.github/actions/docker-build-push@main
#     with:
#       registry: registry.digitalocean.com
#       image-name: my-org/my-app
#       version: ${{ needs.version.outputs.version }}
#       username: ${{ secrets.DO_REGISTRY_TOKEN }}
#       password: ${{ secrets.DO_REGISTRY_TOKEN }}
#       dockerfile: ./Dockerfile
#       context: .
#       platforms: linux/amd64
# =============================================================================
name: 'Docker Build and Push'
author: 'Simplify9'
description: 'Build and push Docker image to container registry'

inputs:
  registry:
    description: 'Container registry URL (e.g., docker.io, registry.digitalocean.com, myregistry.azurecr.io)'
    required: false
    default: 'docker.io'
  image-name:
    description: 'Docker image name (e.g., simplify9/sw-surl-api, my-app)'
    required: true
  version:
    description: 'Version tag for the Docker image'
    required: true
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password or token'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  # Note: emulated arm64 builds on x86 runners are slow — this is inherent to QEMU, not this action.
  # Mitigation (native arm64 runners, remote builders) is infrastructure scope, not template scope.
  platforms:
    description: 'Target platforms for build'
    required: false
    default: 'linux/amd64'
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'
  # When 'true', a 'latest' tag is pushed alongside the versioned tag on EVERY push,
  # so the registry's 'latest' always resolves to the most recently pushed image
  # (regardless of branch). Set to 'false' for builds that must not move 'latest'
  # (e.g. throwaway feature-branch images).
  tag-latest:
    description: "Also tag and push 'latest' on every push"
    required: false
    default: 'true'
  # NOTE: the branch-named tag is NOT an input — it is auto-detected from the ref the
  # workflow is running on (github.ref_name) and always added (sanitized to a valid
  # Docker tag). So a build on 'staging' always also tags the image ':staging'.
  # GHA cache notes:
  # (1) Legacy GHA cache backend shut down 2025-04-15; only Cache Service API v2 is supported.
  #     Staying on current action versions handles this automatically — no config change needed.
  # (2) GHA cache has a ~10 GB/repo limit with LRU + inactivity eviction; can thrash on
  #     large/multi-arch images (limit became raisable Nov 2025, at storage cost).
  # (3) Fallback for large/cross-repo caching: type=registry,ref=<image>:buildcache,mode=max
  #     — not subject to GHA quota, shareable across repos; set cache-from/cache-to manually if needed.
  cache:
    description: 'Enable build cache'
    required: false
    default: 'true'
  build-args:
    description: 'Newline-separated Docker build arguments (KEY=VALUE)'
    required: false
    default: ''
  build-secrets:
    description: 'Newline-separated Docker build secrets (KEY=VALUE) for BuildKit'
    required: false
    default: ''

outputs:
  image-tags:
    description: 'Generated image tags'
    value: ${{ steps.meta.outputs.tags }}
  image-digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Initialize Docker build
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        echo "::group::Docker build context"
        printf '%-12s%s\n' 'Image'     "$IMAGE_NAME:$VERSION"
        printf '%-12s%s\n' 'Registry'  "$REGISTRY"
        printf '%-12s%s\n' 'Platforms' "$PLATFORMS"
        echo "::endgroup::"
        {
          echo "DOCKER_CP1_STATUS=PENDING"
          echo "DOCKER_CP2_STATUS=PENDING"
        } >> "$GITHUB_ENV"

    # Some self-hosted runners of the organisation carry no Docker daemon;
    # their image builds go to a shared BuildKit named by two variables in the
    # RUNNER'S environment. GitHub-hosted runners have neither variable and
    # keep the local builder exactly as before. This must be a shell step: the
    # `env` expression context holds only variables the workflow defines, never
    # the runner process's environment.
    - name: Detect shared builder
      id: builder
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${S9_BUILDKIT_ENDPOINT:-}" && -n "${S9_BUILDKIT_TLS_DIR:-}" ]]; then
          {
            echo "remote=true"
            echo "endpoint=${S9_BUILDKIT_ENDPOINT}"
            echo "tls-dir=${S9_BUILDKIT_TLS_DIR}"
          } >> "$GITHUB_OUTPUT"
          echo "Builder: shared BuildKit (remote driver)"
        else
          echo "remote=false" >> "$GITHUB_OUTPUT"
          echo "Builder: local (docker-container driver)"
        fi

    - name: Refuse multi-platform builds on the shared builder
      if: ${{ steps.builder.outputs.remote == 'true' && inputs.platforms != 'linux/amd64' }}
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        echo "::error title=Multi-platform build on a self-hosted runner::platforms='${PLATFORMS}' needs QEMU, which this runner cannot provide. Build linux/amd64 here, or run this repository on GitHub-hosted runners."
        exit 1

    - name: Set up QEMU
      # Only needed for non-native/multi-arch builds; skip for the single-arch linux/amd64 default to save setup time.
      if: ${{ inputs.platforms != 'linux/amd64' && steps.builder.outputs.remote != 'true' }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: ${{ steps.builder.outputs.remote != 'true' }}
      uses: docker/setup-buildx-action@v4

    - name: Set up Docker Buildx (shared BuildKit)
      if: ${{ steps.builder.outputs.remote == 'true' }}
      uses: docker/setup-buildx-action@v4
      with:
        driver: remote
        endpoint: ${{ steps.builder.outputs.endpoint }}
        driver-opts: |
          cacert=${{ steps.builder.outputs.tls-dir }}/ca.crt
          cert=${{ steps.builder.outputs.tls-dir }}/tls.crt
          key=${{ steps.builder.outputs.tls-dir }}/tls.key

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry != 'docker.io' && inputs.registry || '' }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Confirm registry auth
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        echo "DOCKER_CP1_STATUS=PASSED" >> "$GITHUB_ENV"
        echo "[1/2] Registry auth - $REGISTRY"

    - name: Sanitize branch tag
      id: branchtag
      shell: bash
      env:
        # Auto-detected from the ref being built (e.g. 'staging', 'development') —
        # no input required; the running branch is always added as a tag.
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        # Reduce the branch name to a valid Docker tag: lowercase, keep only
        # [a-z0-9_.-], collapse runs to '-', trim leading/trailing separators,
        # cap at 128 chars. Empty -> empty output (branch tag omitted).
        if [[ -n "${BRANCH:-}" ]]; then
          safe="$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/-{2,}/-/g; s/^[._-]+//; s/[._-]+$//')"
          safe="${safe:0:128}"
        else
          safe=""
        fi
        echo "value=${safe}" >> "$GITHUB_OUTPUT"
        echo "Branch tag: '${safe:-<none>}'"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ inputs.registry != 'docker.io' && format('{0}/{1}', inputs.registry, inputs.image-name) || inputs.image-name }}
        # Three independent tags per build: the version (x.y.z), the branch name
        # (moving), and latest (moving) — kept separate so no single tag gets long.
        tags: |
          type=raw,value=${{ inputs.version }}
          type=raw,value=${{ steps.branchtag.outputs.value }},enable=${{ steps.branchtag.outputs.value != '' }}
          type=raw,value=latest,enable=${{ inputs.tag-latest == 'true' }}
        flavor: |
          latest=false

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7
      env:
        # The shared builder keeps no build history (it would let one
        # repository read another's build arguments), so there is no record to
        # summarise; left on, the step ends with a "no record found" warning.
        DOCKER_BUILD_SUMMARY: ${{ steps.builder.outputs.remote == 'true' && 'false' || 'true' }}
        DOCKER_BUILD_RECORD_UPLOAD: ${{ steps.builder.outputs.remote == 'true' && 'false' || 'true' }}
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        # push and cache are string inputs (composite-action inputs are always strings);
        # comparing with == 'true' ensures unexpected values (e.g. True, 1) degrade predictably.
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        # The shared builder keeps its cache on its own disk; exporting to the
        # GitHub cache would only push layers over the runner's uplink and
        # fill the 10 GB per-repository limit.
        cache-from: ${{ inputs.cache == 'true' && steps.builder.outputs.remote != 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.cache == 'true' && steps.builder.outputs.remote != 'true' && 'type=gha,mode=max' || '' }}
        # provenance: false — deliberate DOCR compatibility choice. DOCR surfaces attestation manifests as
        # phantom unknown/unknown platform entries, interfering with the registry UI and GC.
        # Docker Hub and GHCR support attestations natively; re-enable if targeting those registries.
        provenance: false
        sbom: false
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.build-secrets }}

    - name: Confirm image built and pushed
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        VERSION: ${{ inputs.version }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        echo "DOCKER_CP2_STATUS=PASSED" >> "$GITHUB_ENV"
        echo "[2/2] Image pushed - $IMAGE_NAME:$VERSION ($DIGEST)"

    - name: Report failure
      if: failure()
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        builder="local"
        [[ -n "${S9_BUILDKIT_ENDPOINT:-}" ]] && builder="shared BuildKit at ${S9_BUILDKIT_ENDPOINT} - if it is unreachable, the organisation's CI runbook covers it"
        echo "::error title=Docker build failed for $IMAGE_NAME:$VERSION::Registry $REGISTRY - auth: ${DOCKER_CP1_STATUS:-NOT REACHED} | build/push: ${DOCKER_CP2_STATUS:-NOT REACHED} | builder: ${builder}"

branding:
  icon: 'package'
  color: 'blue'
