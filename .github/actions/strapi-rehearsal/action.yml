# =============================================================================
# Strapi Rehearsal
# =============================================================================
# Boot smoke and data-upgrade rehearsal for Strapi repos. Starts Postgres itself
# (docker, localhost:5432, db/user/password strapi) at the caller's version, else
# the data copy's, else 17. Needs Docker, psql and curl, Node with the HEAD
# dependencies installed and built.
#   strapi-changed=true  restore ci/fixture.sql.gz (or, without one, boot BASE on the
#                        empty database and generate published entries with seed.py),
#                        boot the BASE commit, record counts, columns, values and
#                        content-API responses, boot HEAD on the same database
#                        (migrations run) and require them unchanged, /_health 204
#                        and /admin 200.
#   strapi-changed=false boot HEAD on the empty database and require /_health 204.
# A schema fixed in config/database.* is created (and the fixture moved into it);
# a fixed host, user, password or database name is refused.
# The repo is responsible for a local upload provider and no external services
# under NODE_ENV=ci. Secrets are generated per run; no real secrets are used.
#
# Inputs:
#   base-sha           (optional)  PR base commit; empty forces a HEAD-only boot smoke.
#   strapi-changed     (optional)  'true' to run the rehearsal.
#   working-directory  (optional)  Directory with package.json.
#   package-runner     (optional)  npm, yarn or pnpm (verify-web-install output `runner`).
#   postgres-version   (optional)  Postgres major; empty = the data copy's, else 17.
# =============================================================================
name: 'Strapi Rehearsal'
author: 'Simplify9'
description: 'Boot Strapi against Postgres and, when dependencies or data definitions changed, prove on a scanned fixture (or generated data) that the upgrade keeps content-table row counts, columns, values and content-API responses.'

inputs:
  base-sha:
    description: 'PR base commit SHA. Empty (workflow_dispatch) means boot-smoke HEAD only.'
    required: false
    default: ''
  strapi-changed:
    description: 'true to restore ci/fixture.sql.gz and rehearse the upgrade from base-sha; anything else boots HEAD on an empty database.'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory containing the Strapi project (package.json).'
    required: false
    default: '.'
  package-runner:
    description: 'Tool that runs package scripts: npm, yarn or pnpm.'
    required: false
    default: 'npm'
  postgres-version:
    description: "Postgres major to run. Empty: the version in ci/fixture.sql.gz's header, else 17."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Rehearse
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        STRAPI_CHANGED: ${{ inputs.strapi-changed }}
        WORKDIR: ${{ inputs.working-directory }}
        RUNNER_PM: ${{ inputs.package-runner }}
        PG_INPUT: ${{ inputs.postgres-version }}
        ACTION_PATH: ${{ github.action_path }}
        NODE_ENV: ci
        DATABASE_CLIENT: postgres
        DATABASE_HOST: localhost
        DATABASE_PORT: '5432'
        DATABASE_NAME: strapi
        DATABASE_USERNAME: strapi
        DATABASE_PASSWORD: strapi
        # A config like env('DATABASE_SCHEMA', 'cms') reads public; a schema fixed in config is handled below.
        DATABASE_SCHEMA: public
      run: |
        set -euo pipefail
        echo "VERIFY_STRAPI_REHEARSAL_CP1_STATUS=PENDING" >> "$GITHUB_ENV"
        # shellcheck source=rehearse.sh
        source "${ACTION_PATH}/rehearse.sh"
        # shellcheck source=../verify-web-install/detect_pm.sh
        source "${ACTION_PATH}/../verify-web-install/detect_pm.sh"

        # Fresh secrets for every run; never real ones.
        for v in APP_KEYS ADMIN_JWT_SECRET API_TOKEN_SALT JWT_SECRET TRANSFER_TOKEN_SALT ENCRYPTION_KEY; do
          export "${v}=$(openssl rand -base64 32)"
        done

        head_dir="$(cd "${WORKDIR}" && pwd)"
        repo_root="$(git -C "${head_dir}" rev-parse --show-toplevel)"
        rel="${head_dir#"${repo_root}"}"
        db_url="postgres://strapi:strapi@localhost:5432/strapi"
        health="http://localhost:1337"
        tmp="${RUNNER_TEMP:-/tmp}/strapi-rehearsal"
        mkdir -p "${tmp}"
        server_pid=""
        # The schema config/database.* fixes, if any, else public. Strapi does not create it itself.
        schema="$(config_schema "${head_dir}")"
        export REHEARSAL_SCHEMA="${schema:-public}"

        # Postgres for this run: the caller's version, else the data copy's, else 17.
        pg_v="${PG_INPUT}"; pg_from="input"
        if [ -z "${pg_v}" ]; then pg_v="$(fixture_pg_major "${head_dir}/ci/fixture.sql.gz")"; pg_from="data copy"; fi
        if [ -z "${pg_v}" ]; then pg_v=17; pg_from="default"; fi
        if pg_isready -q -h localhost -p 5432 2> /dev/null; then
          echo "::notice title=[VERIFY] Rehearsal::Postgres already running on localhost:5432; using it"
        else
          docker run -d --name verify-postgres -e POSTGRES_USER=strapi -e POSTGRES_PASSWORD=strapi \
            -e POSTGRES_DB=strapi -p 5432:5432 "postgres:${pg_v}" > /dev/null
          # TCP, not the socket: the image's init server listens on the socket only, then restarts.
          for ((i = 0; i < 90; i++)); do
            docker exec verify-postgres pg_isready -q -h 127.0.0.1 -U strapi -d strapi && break
            sleep 1
          done
          if ! docker exec verify-postgres pg_isready -q -h 127.0.0.1 -U strapi -d strapi; then
            echo "::error title=[VERIFY] Rehearsal::Postgres ${pg_v} did not start"
            exit 1
          fi
          echo "::notice title=[VERIFY] Rehearsal::Postgres ${pg_v} (${pg_from})"
        fi

        stop_server() {
          if [ -n "${server_pid}" ]; then
            # setsid made the server a group leader: kill the whole group (node child included).
            kill -- "-${server_pid}" 2>/dev/null || kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            server_pid=""
          fi
          local i
          for ((i = 0; i < 30; i++)); do
            (exec 3<>/dev/tcp/127.0.0.1/1337) 2>/dev/null || return 0
            sleep 1
          done
          echo "::error title=[VERIFY] Rehearsal::port 1337 did not free after stopping Strapi"
          return 1
        }
        start_server() { # <dir> <log>
          (cd "$1" && exec setsid "${RUNNER_PM}" run start) > "$2" 2>&1 &
          server_pid=$!
        }
        cleanup() {
          stop_server || true
          git -C "${repo_root}" worktree remove --force "${tmp}/base" 2>/dev/null || true
          docker rm -f verify-postgres > /dev/null 2>&1 || true
        }
        trap cleanup EXIT
        boot() { # <dir> <label>: start, require health, leave running
          if ! fixed_db_config "$1"; then
            echo "::error title=[VERIFY] Rehearsal::config/database sets the connection settings listed above as fixed values, so Strapi would ignore verify's throwaway database (and could reach a real one). Read them with env('DATABASE_HOST'), env('DATABASE_SCHEMA', 'public') and so on; a password belongs in a secret, not the repo"
            return 1
          fi
          start_server "$1" "${tmp}/$2.log"
          if ! wait_health "${health}"; then
            echo "::group::Strapi ($2) log tail"; tail -n 80 "${tmp}/$2.log"; echo "::endgroup::"
            return 1
          fi
        }

        if [ "${STRAPI_CHANGED}" = "true" ] && [ -n "${BASE_SHA}" ]; then
          fixture="${head_dir}/ci/fixture.sql.gz"
          if [ -f "${fixture}" ]; then
            mode="ci/fixture.sql.gz"
            # Refuse a fixture that still holds personal data or secrets (values are never printed).
            allow=()
            [ -f "${head_dir}/ci/fixture-allow.txt" ] && allow=(--allow "${head_dir}/ci/fixture-allow.txt")
            if ! python3 "${ACTION_PATH}/../verify-secret-scan/scan.py" --strapi-dump "${allow[@]}" "${fixture}"; then
              echo "::error title=[VERIFY] Rehearsal::ci/fixture.sql.gz failed the personal-data/secret scan (see lines above); regenerate it with scripts/strapi-fixture"
              exit 1
            fi
            gunzip -c "${fixture}" | psql "${db_url}" -v ON_ERROR_STOP=1 -q > /dev/null
            prepare_schema "${db_url}" "${REHEARSAL_SCHEMA}" true
          else
            # No data copy: seed.py fills the base version with generated entries after it boots.
            mode="generated data (no ci/fixture.sql.gz)"
            prepare_schema "${db_url}" "${REHEARSAL_SCHEMA}" false
          fi
          echo "Strapi rehearsal: ${mode}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # The commit the PR merges onto (merge commit's first parent; else the event's base SHA).
          base_ref="$(rehearsal_base "${repo_root}" "${BASE_SHA}")"

          # Intended changes: only the lines this PR adds to ci/rehearsal-expected-changes.txt count.
          mkdir -p "${tmp}/diff"
          git -C "${repo_root}" show "${base_ref}:${rel#/}${rel:+/}ci/rehearsal-expected-changes.txt" \
            > "${tmp}/declared-base.txt" 2>/dev/null || : > "${tmp}/declared-base.txt"
          declared_changes "${tmp}/declared-base.txt" "${head_dir}/ci/rehearsal-expected-changes.txt" > "${tmp}/declared.txt"

          git -C "${repo_root}" worktree add --detach "${tmp}/base" "${base_ref}"
          base_dir="${tmp}/base${rel}"
          base_schema="$(config_schema "${base_dir}")"
          if [ "${base_schema:-public}" != "${REHEARSAL_SCHEMA}" ]; then
            echo "::error title=[VERIFY] Rehearsal::config/database fixes schema \"${base_schema:-public}\" at base and \"${REHEARSAL_SCHEMA}\" at head; change it in a PR of its own"
            exit 1
          fi
          pm="$(detect_pm "${base_dir}")"
          (
            cd "${base_dir}"
            case "${pm}" in
              yarn-berry) yarn install --immutable ;;
              yarn)       yarn install --frozen-lockfile ;;
              npm)        npm ci ;;
              pnpm)       pnpm install --frozen-lockfile ;;
            esac
            "${RUNNER_PM}" run build
          )
          boot "${base_dir}" base
          if [ "${mode}" != "ci/fixture.sql.gz" ]; then
            python3 "${ACTION_PATH}/seed.py" --app "${base_dir}" --base-url "${health}" --db-url "${db_url}" \
              --schema "${REHEARSAL_SCHEMA}" | tee "${tmp}/seed.txt"
            # How much was generated goes into the notice and the summary: types with no entry compare empty.
            seeded="$(sed -n 's/^\[VERIFY\] generated: \([0-9]* entries in [0-9]* of [0-9]* types\)$/\1/p' "${tmp}/seed.txt" | tail -n 1)"
            mode="generated data (no ci/fixture.sql.gz; ${seeded:-entry count unknown})"
            echo "Generated: ${seeded:-entry count unknown}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          table_counts "${db_url}" > "${tmp}/before.txt"
          has_content_tables "${tmp}/before.txt"
          table_columns "${db_url}" > "${tmp}/before-cols.txt"
          column_fingerprints "${db_url}" "${tmp}/before-cols.txt" > "${tmp}/before-fp.txt"
          # Content API as the base serves it, read with a read-only token of the fixture's CI admin.
          # Each side snapshots its own content types: a type new at head is an addition, not a change.
          python3 "${ACTION_PATH}/api_check.py" types --src "${base_dir}" > "${tmp}/types-base.json"
          python3 "${ACTION_PATH}/api_check.py" types --src "${head_dir}" > "${tmp}/types-head.json"
          api_token="$(python3 "${ACTION_PATH}/api_check.py" token --base-url "${health}")"
          echo "::add-mask::${api_token}"
          python3 "${ACTION_PATH}/api_check.py" snapshot --base-url "${health}" --token "${api_token}" \
            --types "${tmp}/types-base.json" --out "${tmp}/api-before"
          stop_server
          echo "Base: $(wc -l < "${tmp}/before.txt") tables counted"

          boot "${head_dir}" head
          table_counts "${db_url}" > "${tmp}/after.txt"
          table_columns "${db_url}" > "${tmp}/after-cols.txt"
          column_fingerprints "${db_url}" "${tmp}/after-cols.txt" > "${tmp}/after-fp.txt"
          python3 "${ACTION_PATH}/api_check.py" snapshot --base-url "${health}" --token "${api_token}" \
            --types "${tmp}/types-head.json" --out "${tmp}/api-after"
          admin_code="$(curl -sL -o /dev/null -w '%{http_code}' "${health}/admin" || true)"
          stop_server

          failed=()
          compare_counts "${tmp}/before.txt" "${tmp}/after.txt" "${tmp}/declared.txt" > "${tmp}/diff/counts.txt" || failed+=("row counts")
          compare_columns "${tmp}/before-cols.txt" "${tmp}/after-cols.txt" "${tmp}/declared.txt" > "${tmp}/diff/columns.txt" || failed+=("columns")
          compare_fingerprints "${tmp}/before-fp.txt" "${tmp}/after-fp.txt" "${tmp}/declared.txt" > "${tmp}/diff/values.txt" || failed+=("values")
          python3 "${ACTION_PATH}/api_check.py" compare --before "${tmp}/api-before" --after "${tmp}/api-after" \
            --declared "${tmp}/declared.txt" > "${tmp}/diff/api.txt" || failed+=("content API")
          if [ "${admin_code}" != "200" ]; then
            echo "[VERIFY] rehearsal: head /admin returned ${admin_code:-no response}" >> "${tmp}/diff/api.txt"
            failed+=("admin panel")
          fi
          cat "${tmp}"/diff/*.txt
          if [ "${#failed[@]}" -gt 0 ]; then
            failed_list="$(printf '%s, ' "${failed[@]}")"
            {
              echo "### Strapi rehearsal (${mode}): ${failed_list%, }"
              echo '```'
              cat "${tmp}"/diff/*.txt
              echo '```'
              echo "Full diffs: artifact \`strapi-rehearsal-diff\`."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error title=[VERIFY] Rehearsal::the Strapi upgrade changed data (${failed_list%, }; see lines above). Declare intended changes in ci/rehearsal-expected-changes.txt"
            exit 1
          fi
          declared_n="$(cat "${tmp}"/diff/*.txt | grep -c ' (declared)$' || true)"
          echo "::notice title=[VERIFY] Rehearsal::upgrade from ${base_ref:0:7} on ${mode} kept content-table row counts, columns, values and content-API responses (${declared_n} declared change(s) reported); /_health 204 and /admin 200"
        else
          prepare_schema "${db_url}" "${REHEARSAL_SCHEMA}" false
          boot "${head_dir}" head
          stop_server
          echo "::notice title=[VERIFY] Rehearsal::boot smoke passed (/_health returned 204 on an empty database)"
        fi
        echo "VERIFY_STRAPI_REHEARSAL_CP1_STATUS=PASSED" >> "$GITHUB_ENV"

    # Column/value/API diffs, kept for 5 days when the rehearsal fails.
    - name: Upload rehearsal diff
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: strapi-rehearsal-diff
        path: ${{ runner.temp }}/strapi-rehearsal/diff
        retention-days: 5
        if-no-files-found: ignore

branding:
  icon: 'database'
  color: 'blue'
