# =============================================================================
# Verify Plan
# =============================================================================
# Computes the planning outputs of the verify workflow: the effective
# known-failing list, whether dependency files changed, and the contract mode.
# Logic lives in scope.sh (tested by test_scope.sh).
#
# Inputs:
#   event-name         (optional)  github.event_name; workflow_dispatch means deps_changed=true.
#   repository         (optional)  owner/repo for the PR files API.
#   pr-number          (optional)  Pull request number (ignored on workflow_dispatch).
#   known-failing      (optional)  Space-separated step ids tolerated until the deadline.
#                                  New step ids (scope.sh NEW_STEPS) are added until their own deadline.
#   deadline           (optional)  YYYY-MM-DD; empty means warn mode, known-failing never expires.
#   stack              (optional)  The verify stack; scopes the tolerated new step ids.
#   github-token       (optional)  Token with pull-requests: read.
#   head-ref           (optional)  The branch under test. renovate/strict-* (Renovate's developer-tool
#                                  majors, which merge by themselves) is judged as if the deadline were today;
#                                  renovate/*ios-toolchain* never tolerates `ios`.
# Outputs: known_failing, repo_known_failing, deadline, deps_changed, contract_mode, strapi_changed, tests_changed.
# =============================================================================
name: 'Verify Plan'
author: 'Simplify9'
description: 'Compute the verify plan: effective known-failing list, deps_changed and contract_mode.'

inputs:
  event-name:
    description: 'The github.event_name of the run.'
    required: false
    default: ''
  repository:
    description: 'owner/repo whose PR files are listed.'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number (unused on workflow_dispatch).'
    required: false
    default: ''
  known-failing:
    description: 'Space-separated step ids tolerated until the deadline.'
    required: false
    default: ''
  deadline:
    description: 'Contract deadline (YYYY-MM-DD). Empty means warn mode and known-failing never expires.'
    required: false
    default: ''
  stack:
    description: 'The verify stack; scopes which new step ids (scope.sh NEW_STEPS) are tolerated.'
    required: false
    default: ''
  github-token:
    description: 'Token with pull-requests: read, used to list PR files.'
    required: false
    default: ''
  head-ref:
    description: 'The branch under test (the PR head branch, or the dispatched branch). renovate/strict-* is judged as if the deadline were today; renovate/*ios-toolchain* never tolerates ios.'
    required: false
    default: ''

outputs:
  known_failing:
    description: 'The known-failing list before the deadline (else empty), plus new step ids still within their own grace period.'
    value: ${{ steps.plan.outputs.known_failing }}
  repo_known_failing:
    description: "The caller's own known-failing list before its deadline (else empty), without new step ids."
    value: ${{ steps.plan.outputs.repo_known_failing }}
  deadline:
    description: 'The contract deadline this run applies: today on a renovate/strict-* branch, else the deadline input.'
    value: ${{ steps.plan.outputs.deadline }}
  deps_changed:
    description: 'true when dependency files changed (always true on workflow_dispatch).'
    value: ${{ steps.plan.outputs.deps_changed }}
  contract_mode:
    description: 'warn or enforce.'
    value: ${{ steps.plan.outputs.contract_mode }}
  strapi_changed:
    description: 'true when the PR changed any dependency file (package.json or a lock file), a database migration, a content-type schema or a component (false on workflow_dispatch).'
    value: ${{ steps.plan.outputs.strapi_changed }}
  tests_changed:
    description: 'true when the PR changed critical-journey or integration test files (scope.sh tests_changed_from_list; false on workflow_dispatch). The tests-probe job reads it.'
    value: ${{ steps.plan.outputs.tests_changed }}

runs:
  using: composite
  steps:
    - name: Plan
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT: ${{ inputs.event-name }}
        REPO: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        KNOWN_FAILING: ${{ inputs.known-failing }}
        STACK: ${{ inputs.stack }}
        DEADLINE: ${{ inputs.deadline }}
        HEAD_REF: ${{ inputs.head-ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        echo "VERIFY_PLAN_CP1_STATUS=PENDING" >> "$GITHUB_ENV"
        # shellcheck source=scope.sh
        source "${ACTION_PATH}/scope.sh"
        today="$(date -u +%F)"
        deadline="$(effective_deadline "${DEADLINE}" "${today}" "${HEAD_REF}")"
        if [ "${deadline}" != "${DEADLINE}" ]; then
          echo "::notice title=[VERIFY] Strict::${HEAD_REF} is a developer-tool major that merges by itself: judged as if the contract deadline were today (${today}), so nothing in known-failing is tolerated and the contract is enforced"
        fi
        known="$(branch_known_failing "$(effective_known_failing "${KNOWN_FAILING}" "${deadline}" "${today}" "${STACK}")" "${HEAD_REF}")"
        repo_known="$(branch_known_failing "$(known_failing_effective "${KNOWN_FAILING}" "${deadline}" "${today}")" "${HEAD_REF}")"
        mode="$(contract_mode "${deadline}" "${today}")"
        deps=true
        strapi=false
        tests=false
        if [ "${EVENT}" != "workflow_dispatch" ]; then
          files="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          deps="$(deps_changed_from_list "${files}")"
          strapi="$(strapi_changed_from_pr "${files}")"
          tests="$(tests_changed_from_list "${files}" "${STACK}")"
        fi
        {
          echo "known_failing=${known}"
          echo "repo_known_failing=${repo_known}"
          echo "deadline=${deadline}"
          echo "deps_changed=${deps}"
          echo "contract_mode=${mode}"
          echo "strapi_changed=${strapi}"
          echo "tests_changed=${tests}"
        } >> "${GITHUB_OUTPUT}"
        echo "::notice title=[VERIFY] Plan::event=${EVENT} deps_changed=${deps} strapi_changed=${strapi} tests_changed=${tests} contract_mode=${mode} deadline=${deadline:-none} known_failing=${known:-none}"
        echo "VERIFY_PLAN_CP1_STATUS=PASSED" >> "$GITHUB_ENV"

branding:
  icon: 'check-square'
  color: 'blue'
