# =============================================================================
# Verify Flutter E2E
# =============================================================================
# The Flutter `e2e` step of verify: runs `flutter test integration_test` on an
# Android emulator with no outbound network except loopback and
# e2e/allowed-hosts.txt.
#   1. Scans committed e2e recordings and e2e/mocks.json (verify-secret-scan).
#   2. Before the block: enables KVM and installs the API 34 x86_64 emulator
#      image (verify-emulator), runs `flutter pub get` and a debug build so
#      Gradle's dependencies are cached, and installs Mockoon when
#      e2e/mocks.json exists.
#   3. Turns the network block on (verify-netblock). Mockoon serves
#      e2e/mocks.json on 127.0.0.1:3901, forwarded into the emulator with
#      adb reverse; the emulator boots blocked (one retry; "did not boot" is
#      reported as infrastructure).
#   4. Runs `flutter test integration_test --no-pub` blocked with
#      --dart-define=VERIFY_E2E=true and, with mocks,
#      --dart-define=E2E_API_URL=http://localhost:3901. A failure re-runs once
#      with the block still on (passing then = flaky, named). If it fails again
#      while the block rejected traffic, it re-runs once with the block lifted:
#      passing then sets output network=needed (the workflow's `network` step
#      reports it).
#   5. Names flaky and failed tests in the job summary. The step has a
#      35-minute timeout in verify.yml. Evidence (test log, logcat,
#      emulator and Mockoon logs) is left in ${RUNNER_TEMP}/flutter-e2e-report.
# Needs a GitHub-hosted runner (KVM, root network control) and Flutter on PATH.
# Logic: flutter_e2e.sh (helpers tested by test_flutter_e2e.sh).
#
# Inputs:
#   working-directory  (optional)  Project directory. Default ".".
#   network-recheck    (optional)  true (default) while `network` is tolerated: a failure with
#                                  blocked traffic re-runs once with network access. false once it
#                                  is enforced: fail without that re-run (never real hosts).
# Outputs:
#   network  "needed" when the tests passed only with network access, else empty.
# =============================================================================
name: 'Verify Flutter E2E'
author: 'Simplify9'
description: 'Run Flutter integration tests on an Android emulator with outbound network blocked, mocks served and evidence collected.'

inputs:
  working-directory:
    description: 'Project directory (contains pubspec.yaml and integration_test/).'
    required: false
    default: '.'

  network-recheck:
    description: 'true while the `network` step is tolerated: a failure with blocked traffic re-runs once with network access. false once it is enforced: fail without that re-run.'
    required: false
    default: 'true'

outputs:
  network:
    description: '"needed" when the tests passed only with network access, else empty.'
    value: ${{ steps.e2e.outputs.network }}

runs:
  using: composite
  steps:
    - name: Flutter integration tests
      id: e2e
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        NETWORK_RECHECK: ${{ inputs.network-recheck }}
      run: bash "${ACTION_PATH}/flutter_e2e.sh"

branding:
  icon: 'smartphone'
  color: 'blue'
