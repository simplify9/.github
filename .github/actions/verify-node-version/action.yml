name: 'Verify: Node.js version'
description: >-
  The Node.js version verify sets up: the caller's node-version input, else the repo's
  .nvmrc/.node-version, else the first FROM node:<N> in its Dockerfiles, else 24 (node_version.sh).
  Verify used to run every repo on 24, so a Node major bump was never actually tested. With an explicit
  node-version input that differs from .nvmrc/.node-version, it warns. android-build.yml and ios-build.yml
  use it too, so a React Native app is built on the Node verify tested.
inputs:
  working-directory:
    description: Directory with package.json.
    required: false
    default: '.'
  node-version:
    description: The caller's explicit node-version input (empty = resolve from the repo).
    required: false
    default: ''
outputs:
  version:
    description: The version to hand to actions/setup-node.
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        DIR: ${{ inputs.working-directory }}
        EXPLICIT: ${{ inputs.node-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/node_version.sh"
        read -r version source < <(node_version "${DIR}" "${EXPLICIT}")
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "::notice title=[VERIFY] Node.js::${version} (from ${source})"
        # An explicit node-version input can differ from what the repo declares. Say so: a PR that only
        # bumps .nvmrc is then not tested (or built) on that Node.
        if [ "${source}" = input ] && read -r file declared < <(declared_mismatch "${DIR}" "${version}"); then
          echo "::warning title=[VERIFY] Node.js::${file} says Node ${declared}, but this check runs on Node ${version} (the caller's node-version input). A change to ${file} alone is not tested here; drop the input to use the repo's version."
        fi
