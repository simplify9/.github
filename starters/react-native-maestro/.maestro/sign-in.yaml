# Journey 2: sign in through the mocked API (e2e/mocks.json answers POST /login).
# Give inputs a testID in the app; Maestro finds it with `id`.
appId: com.example.app
---
- launchApp
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 180000
- tapOn:
    id: "email"
- inputText: "user@example.com"
- tapOn:
    id: "password"
- inputText: "not-a-real-password"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Welcome, Test User"
    timeout: 30000
